<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 420 240">

  <!-- Logo UIS (URL de Wikipedia que sí funciona) -->
  <image x="20" y="20" width="200" height="200"
         xlink:href="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Universidad_Industrial_de_Santander_logo.svg/3840px-Universidad_Industrial_de_Santander_logo.svg.png"
         href="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Universidad_Industrial_de_Santander_logo.svg/3840px-Universidad_Industrial_de_Santander_logo.svg.png"/>

  <!-- Logo GitHub (Wikimedia, reemplaza el de Pixabay) -->
  <image x="245" y="55" width="140" height="140"
         xlink:href="https://www.stickpng.com/assets/images/5847f5bdcef1014c0b5e489c.png"
         href="https://www.stickpng.com/assets/images/5847f5bdcef1014c0b5e489c.png"/>

  <!-- Marco azul institucional -->
  <rect x="2" y="2" width="416" height="236" rx="12"
        fill="none" stroke="#003366" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="130 1194">
    <animate attributeName="stroke-dashoffset" from="0" to="-1324"
             dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Marco dorado -->
  <rect x="2" y="2" width="416" height="236" rx="12"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="60 1264">
    <animate attributeName="stroke-dashoffset" from="0" to="1324"
             dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
