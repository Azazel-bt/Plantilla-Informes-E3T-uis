<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" preserveAspectRatio="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00509e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect width="1000" height="160" fill="url(#grad)"/>
  
  <!-- Ondas de señal animadas -->
  <g stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6">
    <path d="M0,80 Q100,40 200,80 T400,80 T600,80 T800,80 T1000,80">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
               values="M0,80 Q100,40 200,80 T400,80 T600,80 T800,80 T1000,80;
                       M0,80 Q100,120 200,80 T400,80 T600,80 T800,80 T1000,80;
                       M0,80 Q100,40 200,80 T400,80 T600,80 T800,80 T1000,80"/>
    </path>
    <path d="M0,100 Q100,60 200,100 T400,100 T600,100 T800,100 T1000,100" opacity="0.4">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
               values="M0,100 Q100,60 200,100 T400,100 T600,100 T800,100 T1000,100;
                       M0,100 Q100,140 200,100 T400,100 T600,100 T800,100 T1000,100;
                       M0,100 Q100,60 200,100 T400,100 T600,100 T800,100 T1000,100"/>
    </path>
  </g>
  
  <!-- Torre de telecomunicaciones (silueta simple) -->
  <g fill="#ffffff" opacity="0.15">
    <path d="M500,160 L480,80 L490,80 L500,40 L510,80 L520,80 Z"/>
    <circle cx="500" cy="40" r="8" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <line x1="500" y1="48" x2="500" y2="80" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Título -->
  <text x="500" y="90" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">
    📡 COMUNICACIONES II
  </text>
  <text x="500" y="125" font-family="Arial, sans-serif" font-size="16" fill="#c9a227" text-anchor="middle">
    Universidad Industrial de Santander
  </text>
</svg>
